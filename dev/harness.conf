# MTS Cave Teams' settings for the test harness.
# The dev/*.sh harness files are copies of the factorio-client-testing
# skill's reference/ folder; this file is the repo's own part. The names
# are explained in dev/harness-lib.sh.
ABBR=MCT
SETS=(base space-age)
TICKS=300
MP_PORT=34310
TEST_MOD=mct-test
DEPS=(
  "multi-team-support $HOME/src/multi-team-support master"
  "the-cave $HOME/src/the-cave${CAVE_REV:+ $CAVE_REV}"   # CAVE_REV=<git rev>: that committed tree
)

# CAVE_MODE=train-interiors, shelter-defense or advancing-collapse loads a
# generated settings mod that turns that Cave startup mode on; MCT_DISBAND=1
# makes it turn this mod's "Disband a defeated team" on as well.
harness_stage_hook() { # <mods dir>
  [ -n "${CAVE_MODE:-}${MCT_DISBAND:-}" ] || return 0
  local dir="$1/cave-dev-mode"
  mkdir -p "$dir"
  cat > "$dir/info.json" <<JSON
{ "name": "cave-dev-mode", "version": "1.0.0", "title": "The Cave dev mode setting", "author": "test harness",
  "factorio_version": "${ENGINE_VERSION:-$MOD_FV}", "dependencies": ["the-cave", "mts-cave-teams"] }
JSON
  : > "$dir/settings-final-fixes.lua"
  [ -z "${CAVE_MODE:-}" ] || printf 'data.raw["string-setting"]["the-cave-%s"].default_value = "enabled"\n' "$CAVE_MODE" \
    >> "$dir/settings-final-fixes.lua"
  [ -z "${MCT_DISBAND:-}" ] || echo 'data.raw["bool-setting"]["mts-cave-teams-disband-on-defeat"].default_value = true' \
    >> "$dir/settings-final-fixes.lua"
}
